name: Feature request
description: Propose an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Proposals that preserve the project's research-first, explainable, and
        human-reviewed posture are most likely to land. See CONTRIBUTING.md for
        contribution priorities.
  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: What can't you do today, or what is harder than it should be?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: What would you like to see? Sketches, API shapes, and workflow descriptions all welcome.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your perspective
      description: Helps us understand who the feature serves.
      options:
        - Researcher
        - Educator / instructor
        - Clinical informatics / interoperability professional
        - Patient navigator / care coordinator
        - Software contributor
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
