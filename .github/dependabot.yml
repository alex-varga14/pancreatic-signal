version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      js-deps:
        patterns:
          - "*"
    ignore:
      # Majors (Next/React/TS/ESLint) are migration projects, not refreshes;
      # they are tracked as dedicated issues instead of grouped auto-PRs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
