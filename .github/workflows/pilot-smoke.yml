name: Pilot Smoke

run-name: >-
  Pilot Smoke (${{ github.event_name == 'workflow_dispatch' && inputs.smoke_scope || github.event_name }})

on:
  workflow_dispatch:
    inputs:
      smoke_scope:
        description: Hosted matrix slice to run
        required: true
        default: all
        type: choice
        options:
          - all
          - fhir-success-only
          - hl7-success-only
  schedule:
    - cron: "0 15 * * 1"

permissions:
  contents: read

concurrency:
  group: pilot-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot-smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SMOKE_WAIT_SECONDS: "180"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Proxy Demo Smoke
            hosted_mode: default
            manual_scope: base-success
            artifact_name: proxy-demo-smoke
            up: make pilot-proxy-demo-up
            smoke: make pilot-proxy-demo-smoke
            down: make pilot-proxy-demo-down
            compose_args: -f docker-compose.yml -f docker-compose.pilot.yml -f docker-compose.pilot.proxy-demo.yml
          - name: Proxy Demo FHIR Smoke
            hosted_mode: default
            manual_scope: fhir-success
            artifact_name: proxy-demo-fhir-smoke
            up: make pilot-proxy-demo-up
            smoke: make pilot-proxy-demo-fhir-smoke
            down: make pilot-proxy-demo-down
            compose_args: -f docker-compose.yml -f docker-compose.pilot.yml -f docker-compose.pilot.proxy-demo.yml
          - name: Proxy Demo HL7 Smoke
            hosted_mode: manual_only
            manual_scope: hl7-success
            artifact_name: proxy-demo-hl7-smoke
            up: make pilot-proxy-demo-up
            smoke: make pilot-proxy-demo-hl7-smoke
            down: make pilot-proxy-demo-down
            compose_args: -f docker-compose.yml -f docker-compose.pilot.yml -f docker-compose.pilot.proxy-demo.yml
          - name: Proxy Demo Site Rejection Smoke
            hosted_mode: default
            manual_scope: report-site-rejection
            artifact_name: proxy-demo-site-rejection-smoke
            up: make pilot-proxy-demo-up
            smoke: make pilot-proxy-demo-site-rejection-smoke
            down: make pilot-proxy-demo-down
            compose_args: -f docker-compose.yml -f docker-compose.pilot.yml -f docker-compose.pilot.proxy-demo.yml
          - name: Proxy Demo Adapter Site Rejection Smoke
            hosted_mode: default
            manual_scope: structured-site-rejection
            artifact_name: proxy-demo-adapter-site-rejection-smoke
            up: make pilot-proxy-demo-up
            smoke: make pilot-proxy-demo-adapter-site-rejection-smoke
            down: make pilot-proxy-demo-down
            compose_args: -f docker-compose.yml -f docker-compose.pilot.yml -f docker-compose.pilot.proxy-demo.yml
          - name: Header Demo Smoke
            hosted_mode: default
            manual_scope: base-success
            artifact_name: header-demo-smoke
            up: make pilot-header-demo-up
            smoke: make pilot-header-demo-smoke
            down: make pilot-header-demo-down
            compose_args: -f docker-compose.yml -f docker-compose.pilot.yml -f docker-compose.pilot.header-demo.yml
          - name: Header Demo FHIR Smoke
            hosted_mode: default
            manual_scope: fhir-success
            artifact_name: header-demo-fhir-smoke
            up: make pilot-header-demo-up
            smoke: make pilot-header-demo-fhir-smoke
            down: make pilot-header-demo-down
            compose_args: -f docker-compose.yml -f docker-compose.pilot.yml -f docker-compose.pilot.header-demo.yml
          - name: Header Demo HL7 Smoke
            hosted_mode: manual_only
            manual_scope: hl7-success
            artifact_name: header-demo-hl7-smoke
            up: make pilot-header-demo-up
            smoke: make pilot-header-demo-hl7-smoke
            down: make pilot-header-demo-down
            compose_args: -f docker-compose.yml -f docker-compose.pilot.yml -f docker-compose.pilot.header-demo.yml
          - name: Header Demo Site Rejection Smoke
            hosted_mode: default
            manual_scope: report-site-rejection
            artifact_name: header-demo-site-rejection-smoke
            up: make pilot-header-demo-up
            smoke: make pilot-header-demo-site-rejection-smoke
            down: make pilot-header-demo-down
            compose_args: -f docker-compose.yml -f docker-compose.pilot.yml -f docker-compose.pilot.header-demo.yml
          - name: Header Demo Adapter Site Rejection Smoke
            hosted_mode: default
            manual_scope: structured-site-rejection
            artifact_name: header-demo-adapter-site-rejection-smoke
            up: make pilot-header-demo-up
            smoke: make pilot-header-demo-adapter-site-rejection-smoke
            down: make pilot-header-demo-down
            compose_args: -f docker-compose.yml -f docker-compose.pilot.yml -f docker-compose.pilot.header-demo.yml

    steps:
      - name: Select matrix slice
        id: matrix_gate
        shell: bash
        run: |
          should_run=false
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ matrix.hosted_mode }}" != "manual_only" ]]; then
              should_run=true
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.smoke_scope }}" in
              all)
                if [[ "${{ matrix.hosted_mode }}" != "manual_only" ]]; then
                  should_run=true
                fi
                ;;
              fhir-success-only)
                if [[ "${{ matrix.manual_scope }}" == "fhir-success" ]]; then
                  should_run=true
                fi
                ;;
              hl7-success-only)
                if [[ "${{ matrix.manual_scope }}" == "hl7-success" ]]; then
                  should_run=true
                fi
                ;;
            esac
          fi
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.matrix_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.matrix_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies
        if: steps.matrix_gate.outputs.should_run == 'true'
        run: make api-install

      - name: Boot pilot overlay
        if: steps.matrix_gate.outputs.should_run == 'true'
        run: ${{ matrix.up }}

      - name: Run pilot smoke
        id: run_pilot_smoke
        if: steps.matrix_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -o pipefail
          start_epoch="$(date +%s)"
          start_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ${{ matrix.smoke }} 2>&1 | tee pilot-smoke.log
          status="${PIPESTATUS[0]}"
          end_epoch="$(date +%s)"
          end_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "smoke_exit_code=${status}" >> "$GITHUB_OUTPUT"
          echo "smoke_duration_seconds=$((end_epoch - start_epoch))" >> "$GITHUB_OUTPUT"
          echo "smoke_started_at=${start_iso}" >> "$GITHUB_OUTPUT"
          echo "smoke_finished_at=${end_iso}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Upload pilot smoke log
        if: always() && steps.matrix_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pilot-smoke-${{ matrix.artifact_name }}
          path: pilot-smoke.log
          if-no-files-found: ignore

      - name: Generate pilot smoke summary artifacts
        if: always() && steps.matrix_gate.outputs.should_run == 'true'
        run: |
          python scripts/summarize_pilot_smoke.py \
            --log-path pilot-smoke.log \
            --out-json pilot-smoke-summary.json \
            --out-markdown pilot-smoke-summary.md \
            --workflow-name "${{ github.workflow }}" \
            --job-name "${{ matrix.name }}" \
            --job-scope "${{ matrix.manual_scope }}" \
            --dispatch-scope "${{ github.event_name == 'workflow_dispatch' && inputs.smoke_scope || '' }}" \
            --smoke-command "${{ matrix.smoke }}" \
            --log-artifact-name "pilot-smoke-${{ matrix.artifact_name }}" \
            --summary-artifact-name "pilot-smoke-summary-${{ matrix.artifact_name }}" \
            --event-name "${{ github.event_name }}" \
            --outcome "${{ steps.run_pilot_smoke.outcome }}" \
            --exit-code "${{ steps.run_pilot_smoke.outputs.smoke_exit_code }}" \
            --duration-seconds "${{ steps.run_pilot_smoke.outputs.smoke_duration_seconds }}" \
            --started-at "${{ steps.run_pilot_smoke.outputs.smoke_started_at }}" \
            --finished-at "${{ steps.run_pilot_smoke.outputs.smoke_finished_at }}" \
            --summary-generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            --sha "${{ github.sha }}"

      - name: Upload pilot smoke summary artifacts
        if: always() && steps.matrix_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pilot-smoke-summary-${{ matrix.artifact_name }}
          path: |
            pilot-smoke-summary.json
            pilot-smoke-summary.md
          if-no-files-found: ignore

      - name: Write pilot smoke summary
        if: always() && steps.matrix_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          if [[ -f pilot-smoke-summary.md ]]; then
            cat pilot-smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Note skipped matrix slice
        if: steps.matrix_gate.outputs.should_run != 'true'
        run: |
          {
            echo "## Pilot Smoke"
            echo "- Matrix job: ${{ matrix.name }}"
            echo "- Scope: ${{ matrix.manual_scope }}"
            echo "- Hosted mode: ${{ matrix.hosted_mode }}"
            echo "- Status: skipped for this event or dispatch scope"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show compose status on failure
        if: failure() && steps.matrix_gate.outputs.should_run == 'true'
        run: docker compose ${{ matrix.compose_args }} ps

      - name: Show compose logs on failure
        if: failure() && steps.matrix_gate.outputs.should_run == 'true'
        run: docker compose ${{ matrix.compose_args }} logs --no-color --tail=200

      - name: Tear down pilot overlay
        if: always() && steps.matrix_gate.outputs.should_run == 'true'
        run: ${{ matrix.down }}
